<h2 class="text-2xl font-bold mt-5">Buscar Gifs</h2>
<h3 class="text-sm text-gray-500">Buscar gifs por nombre, descripcion o tags</h3>

<section class="grid grid-cols-3 gap-4">
    <input type="text" placeholder="Buscar Gifs" class="mt-3 border border-gray-300 rounded-md p-2 col-span-2"
        (keyup.enter)="onSearch(searchInput.value)" #searchInput/>
    <button type="button"
        class="mt-3 text-white bg-blue-700 hover:bg-blue-800 focus-visible:ring-4 focus-visible:ring-blue-300 focus-visible:outline-none font-medium rounded-lg text-sm px-4 py-2.5"
        (click)="onSearch(searchInput.value)"
        >Buscar</button>
</section>

<section class="py-5">
    <gif-list [gifs]="gifs()"></gif-list>
</section>
